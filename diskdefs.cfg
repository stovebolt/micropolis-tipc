# Greaseweazle disk definitions for Micropolis for TIPC: the same as ibm.360 and ibm.720, but with 2:1 sector interleave,
# so the 5 MHz TIPC does not lose a turn of the disk after every sector.  Use with:
#   gw write --diskdefs=diskdefs.cfg --format=tipc.360 disks/MICRO360.img
#   gw write --diskdefs=diskdefs.cfg --format=tipc.720 disks/MICRO720.img
disk tipc.360
    cyls = 40
    heads = 2
    tracks * ibm.mfm
        secs = 9
        bps = 512
        interleave = 2
        gap3 = 84
        rate = 250
    end
end

disk tipc.720
    cyls = 80
    heads = 2
    tracks * ibm.mfm
        secs = 9
        bps = 512
        interleave = 2
        gap3 = 84
        rate = 250
    end
end
